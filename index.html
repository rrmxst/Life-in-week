
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A life in weeks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1814;
    --paper: #f5f2ec;
    --muted: #9e9890;
    --accent: #2a2520;
    --lived: #1a1814;
    --unlived: #e0dbd0;
    --border: #d4cfc6;
    --serif: 'EB Garamond', Georgia, serif;
    --mono: 'DM Mono', monospace;
  }

  html, body {
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
  }

  /* ── STEP 1 ── */
  #step1 {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    text-align: center;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  #step1.fade-out {
    opacity: 0;
    transform: translateY(-24px);
    pointer-events: none;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 2.5rem;
  }

  h1 {
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: -0.01em;
    max-width: 480px;
    margin-bottom: 1.2rem;
  }

  h1 em {
    font-style: italic;
    color: var(--muted);
  }

  .subtitle {
    font-size: clamp(0.95rem, 2.5vw, 1.05rem);
    color: var(--muted);
    max-width: 360px;
    line-height: 1.7;
    margin-bottom: 3.5rem;
    font-style: italic;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.2rem;
    width: 100%;
    max-width: 320px;
  }

  label {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    align-self: flex-start;
  }

  input[type="date"] {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    padding: 0.6rem 0;
    font-family: var(--mono);
    font-size: 1rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    color-scheme: light;
  }

  input[type="date"]:focus {
    border-color: var(--ink);
  }

  /* Custom date icon hint */
  .date-wrapper {
    width: 100%;
    position: relative;
  }

  .date-wrapper::after {
    content: '↓';
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--muted);
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
  }

  button {
    width: 100%;
    padding: 0.9rem 2rem;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-top: 0.5rem;
  }

  button:hover { opacity: 0.75; }
  button:disabled { opacity: 0.3; cursor: not-allowed; }

  .footnote {
    margin-top: 4rem;
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    color: var(--border);
    text-transform: uppercase;
  }

  /* ── STEP 2 ── */
  #step2 {
    display: none;
    opacity: 0;
    transition: opacity 0.8s ease;
    padding: 3rem 1.5rem 5rem;
    max-width: 1000px;
    margin: 0 auto;
  }

  #step2.visible {
    display: block;
  }

  #step2.fade-in {
    opacity: 1;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1.2rem;
    margin-bottom: 3rem;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .top-bar h2 {
    font-size: clamp(1.1rem, 3vw, 1.4rem);
    font-weight: 400;
    font-style: italic;
    color: var(--ink);
  }

  .back-btn {
    background: transparent;
    color: var(--muted);
    border: none;
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 0;
    width: auto;
    margin-top: 0;
    transition: color 0.2s;
  }
  .back-btn:hover { color: var(--ink); opacity: 1; }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 0;
    border: 1px solid var(--border);
    margin-bottom: 3rem;
  }

  .stat-card {
    padding: 1.6rem 1.4rem;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .stat-card:last-child { border-right: none; }

  @media (max-width: 600px) {
    .stat-card { border-right: none; }
    .stat-card:nth-child(odd) { border-right: 1px solid var(--border); }
    .stats-grid { grid-template-columns: 1fr 1fr; }
  }

  .stat-value {
    font-family: var(--mono);
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 300;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 0.5rem;
    color: var(--ink);
  }

  .stat-label {
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    line-height: 1.4;
  }

  /* Legend */
  .legend {
    display: flex;
    gap: 2rem;
    margin-bottom: 1.5rem;
    align-items: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--mono);
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 0;
    flex-shrink: 0;
  }

  .dot-lived { background: var(--lived); }
  .dot-unlived { background: var(--unlived); border: 1px solid var(--border); }

  /* Grid section */
  .grid-section {
    position: relative;
  }

  .age-labels {
    display: flex;
    justify-content: space-between;
    margin-bottom: 0.6rem;
    padding-left: 28px;
  }

  .age-label {
    font-family: var(--mono);
    font-size: 0.55rem;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  .grid-wrapper {
    display: flex;
    gap: 4px;
    align-items: flex-start;
  }

  .year-labels {
    display: flex;
    flex-direction: column;
    gap: 1px;
    flex-shrink: 0;
    width: 24px;
  }

  .year-label {
    font-family: var(--mono);
    font-size: 0.45rem;
    color: var(--border);
    height: var(--cell);
    display: flex;
    align-items: center;
    letter-spacing: 0.04em;
  }

  .weeks-grid {
    display: grid;
    grid-template-columns: repeat(52, var(--cell));
    grid-template-rows: repeat(90, var(--cell));
    gap: 1px;
    --cell: clamp(5px, 1.5vw, 9px);
  }

  .week-cell {
    width: var(--cell);
    height: var(--cell);
    background: var(--unlived);
    border: 1px solid transparent;
    transition: opacity 0.1s;
    position: relative;
  }

  .week-cell.lived {
    background: var(--lived);
  }

  .week-cell.current-week {
    background: var(--lived);
    outline: 2px solid var(--ink);
    outline-offset: 1px;
    z-index: 2;
  }

  .week-cell:hover {
    opacity: 0.6;
  }

  /* Reflection */
  .reflection {
    margin-top: 4rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border);
    max-width: 520px;
  }

  .reflection p {
    font-size: clamp(1rem, 2.5vw, 1.15rem);
    line-height: 1.8;
    color: var(--muted);
    font-style: italic;
  }

  .reflection p span {
    color: var(--ink);
    font-style: normal;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--paper); }
  ::-webkit-scrollbar-thumb { background: var(--border); }

  @media (max-width: 400px) {
    .weeks-grid {
      --cell: 4px;
    }
    .year-label { display: none; }
    .year-labels { display: none; }
  }
</style>
</head>
<body>

<div id="step1">
  <div class="eyebrow">Hun thlirna</div>
  <h1>I hringnun,<br><em>Kar khat zela chhut</em></h1>
  <p class="subtitle">Mihring dam hun chhung hi chawhrualin kar 4,680 vel a ni a. Kar engzat nge i hman tawh le?</p>
  <h3>By Rem</h3>
  <div class="input-group">
    <label for="birthdate">Your date of birth</label>
    <div class="date-wrapper">
      <input type="date" id="birthdate" max="" />
    </div>
    <button id="continueBtn" disabled>En rawh le →</button>
  </div>
  <div class="footnote">Data vawn that leh thawn chhuah a ni lo</div>
</div>


<div id="step2">
  <div class="top-bar">
    <h2 id="greeting">Kar khat zela kan dam chhung hun</h2>
    <button class="back-btn" id="backBtn">← A bul tanginr</button>
  </div>

  <div class="stats-grid" id="statsGrid"></div>

  <div class="legend">
    <div class="legend-item"><div class="dot dot-lived"></div> I hman tawh zat (Kar khat zela chhut)</div>
    <div class="legend-item"><div class="dot dot-unlived"></div> Kar la awm zat</div>
  </div>

  <div class="grid-section">
    <div class="age-labels" id="ageLabels"></div>
    <div class="grid-wrapper">
      <div class="year-labels" id="yearLabels"></div>
      <div class="weeks-grid" id="weeksGrid"></div>
    </div>
  </div>

  <div class="reflection">
    <p id="reflectionText"></p>
  </div>
</div>

<script>
  const birthdateInput = document.getElementById('birthdate');
  const continueBtn = document.getElementById('continueBtn');
  const step1 = document.getElementById('step1');
  const step2 = document.getElementById('step2');
  const backBtn = document.getElementById('backBtn');

  // Set max date to today
  const today = new Date();
  const maxDate = today.toISOString().split('T')[0];
  birthdateInput.setAttribute('max', maxDate);

  // Min date: 120 years ago
  const minD = new Date(today);
  minD.setFullYear(minD.getFullYear() - 120);
  birthdateInput.setAttribute('min', minD.toISOString().split('T')[0]);

  birthdateInput.addEventListener('change', () => {
    continueBtn.disabled = !birthdateInput.value;
  });

  continueBtn.addEventListener('click', () => {
    if (!birthdateInput.value) return;
    const bdate = new Date(birthdateInput.value + 'T00:00:00');
    if (isNaN(bdate)) return;

    step1.classList.add('fade-out');
    setTimeout(() => {
      step1.style.display = 'none';
      buildStep2(bdate);
      step2.classList.add('visible');
      requestAnimationFrame(() => {
        requestAnimationFrame(() => step2.classList.add('fade-in'));
      });
    }, 600);
  });

  backBtn.addEventListener('click', () => {
    step2.classList.remove('fade-in');
    setTimeout(() => {
      step2.classList.remove('visible');
      step2.style.display = '';
      step1.style.display = '';
      step1.classList.remove('fade-out');
    }, 500);
  });

  function buildStep2(birthdate) {
    const now = new Date();

    const msPerWeek = 7 * 24 * 60 * 60 * 1000;
    const totalWeeksLived = Math.floor((now - birthdate) / msPerWeek);
    const totalWeeks = 90 * 52; // 90 years

    const ageMs = now - birthdate;
    const ageYears = ageMs / (365.25 * 24 * 60 * 60 * 1000);
    const ageYearsFloor = Math.floor(ageYears);
    const ageDays = Math.floor(ageMs / (24 * 60 * 60 * 1000));
    const ageMonths = Math.floor(ageYears * 12);
    const weeksRemaining = Math.max(0, totalWeeks - totalWeeksLived);
    const percentLived = ((totalWeeksLived / totalWeeks) * 100).toFixed(1);
    const seasons = Math.floor(ageYears * 4);
    const weekends = Math.floor(totalWeeksLived * 2);
    const sunrises = ageDays;
    const years90 = 90;

    // Greeting
    document.getElementById('greeting').textContent =
      `Kum ${ageYearsFloor}na i hmang mek ani`;

    // Stats
    const stats = [
      { value: fmt(totalWeeksLived), label: 'Kar hman tawh zat' },
      { value: fmt(weeksRemaining), label: 'I dam chhung kar hman tawhte' },
      { value: percentLived + '%', label: '"Kum 90 i tlin nan (% a chhut in)' },
      { value: fmt(ageDays), label: 'Khawvel a i hun hman tawh zat' },
      { value: fmt(seasons), label: 'Hun inthlak kual i paltlang tawhte' },
      { value: fmt(weekends), label: 'Kar tawp hman tawh zat ' },
    ];

    const statsGrid = document.getElementById('statsGrid');
    statsGrid.innerHTML = '';
    stats.forEach(s => {
      const card = document.createElement('div');
      card.className = 'stat-card';
      card.innerHTML = `<div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div>`;
      statsGrid.appendChild(card);
    });

    // Age labels
    const ageLabelsEl = document.getElementById('ageLabels');
    ageLabelsEl.innerHTML = '';
    [0, 10, 20, 30, 40, 50, 60, 70, 80].forEach(age => {
      const span = document.createElement('span');
      span.className = 'age-label';
      span.textContent = age;
      ageLabelsEl.appendChild(span);
    });

    // Year labels (every 5)
    const yearLabelsEl = document.getElementById('yearLabels');
    yearLabelsEl.innerHTML = '';
    for (let y = 0; y < 90; y++) {
      const lbl = document.createElement('div');
      lbl.className = 'year-label';
      lbl.textContent = (y % 10 === 0) ? y : '';
      yearLabelsEl.appendChild(lbl);
    }

    // Grid
    const grid = document.getElementById('weeksGrid');
    grid.innerHTML = '';

    // Figure out which cell is the current partial week
    const currentWeekIndex = totalWeeksLived; // 0-indexed

    for (let i = 0; i < totalWeeks; i++) {
      const cell = document.createElement('div');
      cell.className = 'week-cell';
      if (i < currentWeekIndex) {
        cell.classList.add('lived');
      } else if (i === currentWeekIndex) {
        cell.classList.add('current-week');
      }
      grid.appendChild(cell);
    }

    // Reflection quote
    const reflections = [
      `<span>Kar ${fmt(totalWeeksLived)}</span> zet i dam tawh a. Heng kar tinte hi an tak (real) em em a, a nawn leh tawh ngai lo bawk. A chunga i hmuh kha i nun tak tak a ni — tehkhin thu (metaphor) mai a ni lo.`,
`Kum 90 dam chhung hun atangin <span>${percentLived}%</span> a her liam ta. Kar <span>${fmt(weeksRemaining)}</span> la ziah loh (unwritten) leh hman lohvin an la awm a ni.`,
`I lo pian atangin <span>Zing ${fmt(ageDays)}</span> zet a liam tawh a. A tam zawk chu ni pangngai leh naran tak an ni hlawm. Chu chu thil namai (small thing) a ni lo.`,
    ];

    const pick = reflections[Math.floor(ageYearsFloor % reflections.length)];
    document.getElementById('reflectionText').innerHTML =
      pick + `<br><br>* Kum ${years90} thleng chhut ani.`;
  }

  function fmt(n) {
    return Number(n).toLocaleString();
  }
</script>
</body>
</html>
